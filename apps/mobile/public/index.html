<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="CRM для сервисного бизнеса: записи, клиенты, финансы." />
    <!-- Tab icon: vector first, PNG sizes for browsers without SVG favicons; Expo adds /favicon.ico -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <!-- Home-screen install: iOS takes apple-touch-icon, Android/Chrome the manifest -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-title" content="Babun" />
    <meta name="application-name" content="Babun" />
    <meta name="theme-color" content="#f4f6f9" />
    <!-- Link previews in messengers and social networks -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Babun" />
    <meta property="og:title" content="Babun" />
    <meta property="og:description" content="CRM для сервисного бизнеса: записи, клиенты, финансы." />
    <meta property="og:url" content="https://babun.app/" />
    <meta property="og:image" content="https://babun.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://babun.app/og-image.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- ЗАСТАВКА ДО ЗАГРУЗКИ (владелец 04.10): бандл весит ~15 МБ, и до его
         запуска страница была белой. Знак и круг живут внутри #root —
         первый рендер React заменяет их приложением. -->
    <style id="boot-splash">
      body { margin: 0; background: #f4f6f9; }
      .boot {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }
      .boot img {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        box-shadow: 0 10px 30px rgba(31, 79, 204, 0.18);
      }
      .boot i {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2.5px solid rgba(44, 91, 224, 0.18);
        border-top-color: #2c5be0;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot i { animation-duration: 2.4s; } }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"><div class="boot" aria-label="Babun загружается"><img src="/favicon.svg" alt="Babun" /><i></i></div></div>
  </body>
</html>

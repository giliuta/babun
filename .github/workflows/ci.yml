name: CI

# Quality gates for the React Native app. The Next.js web app was removed
# on 2026-08-25 — the web target is now Expo Web, exported from apps/mobile,
# so there is a single codebase behind iOS, Android and Web.
#
#   typecheck — `tsc --noEmit` over apps/mobile (which pulls in
#               packages/shared through the path alias). Hard gate.
#   test      — `vitest run` over apps/** and packages/**. Hard gate.
#   build:web — `expo export --platform web`, the exact command Vercel
#               runs. Catches web-only breakage (native-only modules,
#               missing shims) before it reaches a deploy.
#
# Lint stays informational — see the pre-existing React-Compiler hints.

on:
  push:
    branches:
      - master
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    name: vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test

  build-web:
    name: expo export (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Export web bundle
        env:
          # The export bakes EXPO_PUBLIC_* vars into the bundle but never
          # talks to Supabase. Placeholders keep the build honest; the real
          # values ship via Vercel's Project Environment Variables.
          EXPO_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "placeholder"
        run: bun run build:web

  lint:
    name: eslint (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: ESLint
        continue-on-error: true
        run: bun run lint
